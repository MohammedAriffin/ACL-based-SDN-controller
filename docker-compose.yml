version: "3.8"

services:
  ryu:
    image: python:3.9-slim
    container_name: ryu-controller
    hostname: ryu
    working_dir: /app
    volumes:
      - ./controller:/app/controller
      - ./requirements.txt:/app/requirements.txt
    command: >
      sh -c "pip install --no-cache-dir -r /app/requirements.txt &&
             ryu-manager /app/controller/acl_controller.py --ofp-tcp-listen-port 6653"
    ports:
      - "6653:6653"
      - "8080:8080"
    networks:
      - sdn_network

  containernet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: containernet-topo
    privileged: true
    depends_on:
      - ryu
    working_dir: /app
    volumes:
      - ./tests:/app/tests
    command: >
      sh -c "sleep 5 && python3 /app/tests/sdn_acl_combined.py && tail -f /dev/null"
    networks:
      - sdn_network
    stdin_open: true
    tty: true

networks:
  sdn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
